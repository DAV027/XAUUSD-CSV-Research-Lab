[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"

[project]
name="xau-lab"
version="0.1.0"
requires-python=">=3.12"
dependencies=[
  "numpy>=2.1,<3",
  "polars>=1.33,<2",
  "pyarrow>=18,<22",
  "scipy>=1.14,<2",
  "numba>=0.61,<1",
]

[project.optional-dependencies]
mt5=["MetaTrader5>=5.0.6147"]
dev=["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
